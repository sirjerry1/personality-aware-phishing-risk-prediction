<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Final Questions</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-body p-4">

            <h2 class="mb-4">
                Final Questions
            </h2>

            <form method="POST">

                <div class="mb-4">

                    <label class="form-label">

                        How confident are you in your ability to identify phishing emails?

                    </label>

                    <select
                        class="form-select"
                        name="confidence"
                        required>

                        <option value="">Select</option>

                        <option value="1">Very Unconfident</option>

                        <option value="2">Unconfident</option>

                        <option value="3">Neutral</option>

                        <option value="4">Confident</option>

                        <option value="5">Very Confident</option>

                    </select>

                </div>

                <div class="mb-4">

                    <label class="form-label">

                        Do you have any comments about this study or phishing awareness?

                    </label>

                    <textarea
                        class="form-control"
                        name="comments"
                        rows="5"
                        placeholder="Optional"></textarea>

                </div>

                <button
                    class="btn btn-primary">

                    Submit

                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
