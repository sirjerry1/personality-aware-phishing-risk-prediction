{% extends "base.html" %}

{% block title %}
Demographic Questionnaire
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-3">Demographic Questionnaire</h2>

        <p class="text-muted">
            Please answer the following questions. Your responses are anonymous
            and will only be used for academic research.
        </p>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Age Group</label>

                <select class="form-select" name="age" required>

                    <option value="">Select Age Group</option>
                    <option>18–24</option>
                    <option>25–34</option>
                    <option>35–44</option>
                    <option>45–54</option>
                    <option>55+</option>

                </select>
            </div>

            <div class="mb-3">

                <label class="form-label">Gender</label>

                <select class="form-select" name="gender" required>

                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Prefer not to say</option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">Occupation</label>

                <select class="form-select" name="occupation" required>

                    <option value="">Select Occupation</option>
                    <option>Student</option>
                    <option>Employed</option>
                    <option>Self-Employed</option>
                    <option>Unemployed</option>
                    <option>Other</option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">Highest Education Level</label>

                <select class="form-select" name="education" required>

                    <option value="">Select Education Level</option>

                    <option>Secondary School</option>

                    <option>Diploma</option>

                    <option>Undergraduate</option>

                    <option>Bachelor's Degree</option>

                    <option>Master's Degree</option>

                    <option>Doctorate (PhD)</option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">How often do you check your email?</label>

                <select class="form-select" name="email_use" required>

                    <option value="">Select One</option>

                    <option>Several times a day</option>

                    <option>Once a day</option>

                    <option>A few times a week</option>

                    <option>Rarely</option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">

                Have you received any cybersecurity awareness training?

                </label>

                <select class="form-select" name="cyber_training" required>

                    <option value="">Select One</option>

                    <option>Yes</option>

                    <option>No</option>

                </select>

            </div>

            <button class="btn btn-primary">

                Continue

            </button>

        </form>

    </div>

</div>

{% endblock %}
